<div class='flex flex-col flex-auto h-full w-full min-w-0'>
    <!-- Header -->
    <div class='relative flex flex-0 items-center w-full min-h-16 px-4 md:px-6 shadow bg-indigo-50'>  
      <div class="inline-flex items-center justify-end w-full">
        @if(!authService.isAuthenticated()) {
            <button
                class="mat-icon-button-48px"
                mat-icon-button
                type="button"
                [routerLink]="['/', appUrlsHelper.signIn]"
            >
              <mat-icon class="mat-icon-32px">login</mat-icon>
            </button>
        }
        @else {
            <button
                class="mat-icon-button-48px"
                mat-icon-button
                type="button"
                [matMenuTriggerFor]="profileMenu"
            >
                <mat-icon class="mat-icon-32px">account_circle</mat-icon>
            </button>
            <mat-menu #profileMenu="matMenu">
              <button mat-menu-item [routerLink]="['/', appUrlsHelper.profile]">Profile</button>
              <button mat-menu-item (click)="authService.signOut()">Sign out</button>
            </mat-menu>
        }
      </div>
    </div>
  
    <!-- Content -->
    <div class='flex flex-col flex-auto'>
      <router-outlet/>
    </div>
  
    <!-- Footer -->
    <div class='relative flex flex-0 items-center justify-center w-full min-h-14 px-4 md:px-6 border-t bg-indigo-50'>
      <span class='font-medium text-secondary'>
        Movie Theatre &copy; 2025
      </span>
    </div>
  </div>
