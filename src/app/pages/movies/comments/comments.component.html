<div class="h-full p-8">
    <div class="flex flex-col mb-4">
        <mat-form-field class="w-full" >
            <mat-label>Your Comment</mat-label>
            <textarea [formControl]="commentControl" matInput></textarea>
        </mat-form-field>

        <button
            class="button-secondary"
            class="self-end"
            mat-flat-button
            type="submit"
            (click)="addComment()"
        >Add</button>
    </div>
    
    <mat-divider></mat-divider>

    <div class="flex justify-center font-bold text-lg py-2">Other comments:</div>
    @if (!comments.length) {
        <div class="w-full h-[200px] flex justify-center items-center text-2xl">
            No comments yet!
        </div>
    }
    @else {
        <div class="max-h-56 overflow-auto">
            @for (comment of comments; track comment) {
                <div class="p-6 rounded-lg border border-dotted my-3">{{comment}}</div>
            }
        </div>
    }
</div>
